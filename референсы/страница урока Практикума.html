                                "type": "theory",
                                "markdown": "# Урок 3. Как сделать презентацию эффективной\n\nПрезентации не делаются в стол — их показывают людям. И чтобы презентация действительно вовлекала и была полезной, дизайнеру важно понимать, для кого он её делает. Чем больше ты узнаешь об аудитории, тем более точную форму сможешь найти и тем выше шанс, что презентация «зацепит». Поэтому на старте стоит подумать или спросить у заказчика, кому адресована презентация, чтобы точно попадать в цель.\n\n![](https:\u002F\u002Fpictures.s3.yandex.net:443\u002Fresources\u002F1.6._Biatlonist_4_2_1622315278_1689249313.jpg)\n\n### Как зацепить аудиторию\n\nКаждый человек живёт в своём «пузыре» из задач, проблем, потребностей, интересов, желаний и страхов. Этот пузырь — то, что человека интересует сегодня, на что он готов обратить внимание и потратить время.\n\n![](https:\u002F\u002Fpictures.s3.yandex.net:443\u002Fresources\u002FFrame_88_1689249334.png)\n\nЕсли мы хотим обратить внимание человека на нас, мы должны как-то вписаться в его мир. Представь, что мы заговорим с человеком о чём-то, что сейчас не входит в его пузырь:\n\n![](https:\u002F\u002Fpictures.s3.yandex.net:443\u002Fresources\u002FFrame_89_1689249351.png)\n\nЧтобы он захотел с нами поговорить, мы должны «зацепить» его, найти что-то важное ему самому. В нашем примере Игорь ещё не решил, что подарить своей девушке или жене на годовщину. Если продавец догадывается о такой потребности, он может это использовать и привлечь внимание Игоря.\n\n![](https:\u002F\u002Fpictures.s3.yandex.net:443\u002Fresources\u002Fframe-1_1689249371.png)\n\nКонечно, не всегда возможно посмотреть на мир глазами аудитории. Но можно задать себе правильные вопросы, благодаря которым ты сформулируешь полезное действие и сделаешь презентацию более вовлекающей.\n"

                            "type": "Markdown",
                            "content": {
                                "type": "theory",
                                "markdown": "### Полезное действие\n\nВ начале работы над презентацией стоит задать себе вопросы:\n\n- Почему человек захочет обратить внимание на мою презентацию?\n- Какие его задачи, проблемы, потребности и интересы она затрагивает?\n- Что хорошего эта презентация может пообещать человеку?\n\nЕсли ответить на эти вопросы, получим представление о полезном действии презентации.\n\nПолезное действие — это то, ради чего человек сам захочет потратить на нас время. Ключевое слово — польза: презентация должна помогать человеку решать его проблемы или достигать своих целей. При этом польза не должна быть абстрактной, она должна быть связана с тем, что его волнует и интересует.\n\nЧасто полезное действие путают с собственными целями. Но цель — это то, что **мы хотим** от человека, а полезное действие — это то, что **хочет он сам**. Сравни:\n\n![](https:\u002F\u002Fpictures.s3.yandex.net:443\u002Fresources\u002FFrame_90_1689249435.png)\n\nПоэтому, например, не может быть полезного действия «проинформировать людей». Информировать нужно нам. Это наша цель. А зачем люди хотят узнать нашу информацию? Скорее всего, чтобы решить свои задачи или побороть страхи.\n"
                            },

                        "faq.taxDeduction.answer": "Это что-то вроде кешбэка от государства. Рассмотрим пример.\n\n\nЕсли вы являетесь налоговым резидентом, то есть находитесь на территории РФ более 183 дней в течение 12 месяцев, и работаете по трудовому договору, то каждый месяц ваш работодатель должен отчислять с вашей зарплаты 13% государству, чтобы оплатить подоходный налог.\n\n\nВот из этих денег вы можете вернуть себе до 15 600 рублей в год в виде налогового вычета за обучение. Для этого вам нужно подать соответствующее заявление через личный кабинет на сайте nalog.ru (можно залогиниться через Госуслуги).\n\n\nК заявлению нужно приложить все документы, подтверждающие ваше право на вычет, такие как:\n\n\n1. Справка 2-НДФЛ от вашего работодателя.\n2. Договор на обучение, в нашем случае это [оферта Практикума](https:\u002F\u002Fyandex.ru\u002Flegal\u002Fpraktikum_offer\u002F).\n3. Лицензия на образовательную деятельность. [Вот наша](https:\u002F\u002Fcode.s3.yandex.net\u002FLicense%20YSDA.pdf).\n4. Чеки об оплате обучения. Практикум отправляет эти чеки на ваш эл.адрес, их можно взять оттуда.\n5. Справка о получении образовательных услуг. Чтобы получить нашу справку, напишите в наш чат поддержки.\n\n\nВаше заявление будут рассматривать в налоговой в течение месяца. Инспектор может запросить другие документы, если этих ему покажется недостаточно. В случае успеха вам должны выдать специальное уведомление о праве на вычет. Это уведомление нужно передать в бухгалтерию вашего работодателя.\n\n\nТеперь работодатель должен будет выплачивать вам всю зарплату, не удерживая подоходный налог в пользу государства, пока не выплатит всю сумму вычета.\n\n\nЭто не единственный вариант получения вычета, подробнее можно почитать [на сайте налоговой](https:\u002F\u002Fwww.nalog.gov.ru\u002Frn77\u002Ftaxation\u002Ftaxes\u002Fndfl\u002Fnalog_vichet\u002Fsoc_nv\u002Fsoc_nv_ob\u002F).\n\n\nЕсли у вас остались вопросы про получение вычета, напишите в наш чат поддержки, постараемся ответить."
